# Dependency updates, grouped (fewer PRs, fewer CI runs: every PR runs the whole
# acctest matrix). Major versions are not grouped: each stays a separate PR to
# review by hand. Weekly, Monday morning.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Moscow"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Moscow"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
